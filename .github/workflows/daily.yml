# 매일 아침 공고를 새로 모아 GitHub Pages 에 배포한다.
# tools.gomstem.io/jiwonkok 은 곰툴스 허브(next.config.ts)가 이 Pages 주소를 이어 준다.
# 수집 건수가 모자라면 build.py 가 실패로 끝나고, 배포는 전날 것이 그대로 남는다.
name: daily

on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 크롤러 받기 (sole-search, 검증한 커밋으로 고정)
        run: |
          git clone https://github.com/djfksjd/sole-search.git vendor/sole-search
          git -C vendor/sole-search checkout f6fd9e8ec43af2465893382021091b9db2bd496a
      - name: 공고 수집 + 페이지 만들기
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py --crawl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
